# ===========================================================================
# Full production-grade stack: Postgres, Redis, Django (web), Celery worker,
# Celery beat, and the nginx-served frontend.
#
#   cp .env.example .env      # then edit secrets
#   docker compose up --build
#
# The web service applies migrations + collectstatic on boot; worker/beat skip
# that via RUN_MIGRATIONS=0. Frontend nginx proxies /api to the backend.
# ===========================================================================
services:
  db:
    image: postgres:17-alpine  # match the pg_dump/pg_restore client major (17)
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karigar}
      POSTGRES_USER: ${POSTGRES_USER:-karigar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karigar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karigar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-karigar}:${POSTGRES_PASSWORD:-karigar}@db:5432/${POSTGRES_DB:-karigar}
      RUN_MIGRATIONS: "1"
      BACKUP_PRIMARY_PATH: /app/backups
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      # Backup destination is a BIND MOUNT (plain host folder), NOT a Docker
      # named volume — so `docker volume rm` / prune never touches backups.
      # Point BACKUP_PRIMARY_HOST at e.g. D:/SecureBackups in .env for real use.
      - ${BACKUP_PRIMARY_HOST:-./secure-backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-karigar}:${POSTGRES_PASSWORD:-karigar}@db:5432/${POSTGRES_DB:-karigar}
      RUN_MIGRATIONS: "0"
      BACKUP_PRIMARY_PATH: /app/backups
    volumes:
      - ${BACKUP_PRIMARY_HOST:-./secure-backups}:/app/backups
    depends_on:
      - backend
      - redis

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-karigar}:${POSTGRES_PASSWORD:-karigar}@db:5432/${POSTGRES_DB:-karigar}
      RUN_MIGRATIONS: "0"
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  static:
