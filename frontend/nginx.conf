# nginx config for the production frontend container.
# Serves the SPA and reverse-proxies API + media to the backend service.
server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache, hashed filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API, admin, media and Django static all pass through to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (server-rendered). The SPA lives elsewhere, so /admin/ must
    # be proxied to the backend rather than falling through to index.html.
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django/admin static assets (served by WhiteNoise). Note: the SPA's own
    # bundles live under /assets/, so /static/ is free for Django.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback: every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
